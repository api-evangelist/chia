aid: chia
name: Chia
description: >-
  Chia Network is the company behind the Chia blockchain, a decentralized
  layer-1 network whose native coin is XCH. Chia replaces energy-intensive Proof
  of Work with Nakamoto-consensus Proof of Space and Time, letting participants
  "farm" with standard disk hardware. The open-source Python reference client
  runs a full node, farmer, harvester, timelord and wallet and exposes a local
  JSON-RPC API (secured with mutual TLS) across full-node, wallet, farmer,
  harvester, DataLayer, DID, NFT, offers, DAO, VC and simulator services, plus
  the `chia` command-line client. On-chain smart transactions are authored in
  Chialisp / CLVM, and the network supports CATs (tokens), NFTs, DIDs, offers,
  DataLayer and DAOs. Chia was surfaced as a portfolio company of a16z and
  Greylock and enriched from its public developer surface.
